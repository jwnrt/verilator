name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string

env:
  GH_TOKEN: ${{ github.token }}
  CI_OS_NAME: linux
  CI_COMMIT: ${{ github.sha }}
  CI_M32: 0

defaults:
  run:
    shell: bash

jobs:

  build:
    runs-on: ubuntu-22.04
    name: Build
    env:
      CI_BUILD_STAGE_NAME: build
      CI_RUNS_ON: ubuntu-22.04
      CC: gcc-11
      CXX: g++-11
      DIST: ${{ github.workspace }}/dist
      VERILATOR_ARCHIVE: ${{ github.workspace }}/verilator-${{ inputs.release_tag }}.tar.gz

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages for build
      run: ./ci/ci-install.bash

    - name: Build
      run: |
        autoconf
        ./configure --prefix="$DIST"
        make -j "$(nproc)"
        make install

    - name: Tar up repository
      working-directory: "${{ env.DIST }}"
      run: tar --posix -c -z -f "$VERILATOR_ARCHIVE" .

    - name: Upload tar archive
      uses: actions/upload-artifact@v4
      with:
        path: ${{ env.VERILATOR_ARCHIVE }}

    - name: Publish release
      run: |
        gh release create --draft "${{ inputs.release_tag }}" \
          --title "${{ inputs.release_tag }}"
        gh release upload "${{ inputs.release_tag }}" "$VERILATOR_ARCHIVE"
